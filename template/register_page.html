<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Shopix</title>
<link rel="stylesheet" href="registerPage.css">
</head>
<body>
<main class="auth">
<section class="brand">
<div><div class="logo">Shop<span><b>ix</b></span></div><p class="tagline">Присоединяйся к Shopix!<br>Открой для себя мир выгодных покупок.</p></div>
<div class="art" aria-hidden="true"><div class="bag"></div><div class="spark">✦</div></div>
</section>
<section class="formside">
<h1>Регистрация</h1>
<p class="intro">Создайте аккаунт, чтобы открыть новые возможности</p>
<form id="registerForm" action="/" method="POST">
<div class="field"><label for="login">Логин</label><div class="inputwrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="login" name="login" placeholder="Придумайте логин" autocomplete="username" class="{{if .ErrLogin}}error{{end}}">
  {{if .ErrLogin}}
    <p class="{{if .ErrLogin}}errLog{{end}}" style="color: red;">{{.ErrLogin}}</p>
  {{end}}

</div></div>
<div class="field"><label for="password">Пароль</label><div class="inputwrap"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" placeholder="Придумайте пароль" autocomplete="new-password" class="{{if .ErrPass}}ErrPass{{end}}">
  {{if .ErrPass}}
    <p class="{{if .ErrPass}}errPass{{end}}" style="color: red;">{{.ErrPass}}</p>
  {{end}}
  <button class="show" type="button" data-toggle="password">◉</button></div></div>
<div class="field"><label for="confirm">Подтвердите пароль</label><div class="inputwrap"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="confirm" name="confirm" type="password" placeholder="Повторите пароль" autocomplete="new-password" class="{{if .ErrPass}}ErrPass{{end}}">
  {{if .ErrPass}}
    <p class="{{if .ErrPass}}errPass{{end}}" style="color: red;">{{.ErrPass}}</p>
  {{end}}
  <button class="show" type="button" data-toggle="confirm">◉</button></div></div>
<button class="submit" type="submit">Зарегистрироваться&nbsp; ›</button><div class="status" id="status" role="status"></div>
</form>
<div class="switch">Уже есть аккаунт?<a href="/SignIn">Войти</a></div>
</section>
</main>
<script>
document.querySelectorAll("[data-toggle]").forEach((button) => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.toggle);
    input.type = input.type === "password" ? "text" : "password";
  });
});
</script>
</body>
</html>
